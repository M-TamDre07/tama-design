name: Site integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify migration files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            index.html
            maintenance.html
            privasi.html
            manifest.json
            robots.txt
            vercel.json
            css/site.css
            css/standards.css
            css/enterprise-ui.css
            css/admin.css
            js/site.js
            js/backend-bridge.js
            js/order-integration.js
            js/adaptive.js
            admin.html
            api/config.js
            api/public.js
            api/messages.js
            api/admin.js
            api/_lib/db.js
            api/_lib/telegram.js
            supabase/migrations/20261019000000_tama_andrea_core.sql
            supabase/migrations/20261019000200_website_message_inbox.sql
            supabase/migrations/20261022200359_explicit_deny_browser_policies.sql
            js/messages.js
            docs/SUPABASE_SETUP.md
            docs/ENVIRONMENT_VARIABLES.md
            tests/environment-contract.test.js
            .env.example
          )
          for f in "${required[@]}"; do
            test -f "$f" || { echo "Missing required file: $f"; exit 1; }
          done
          test ! -e backend/google-apps-script/code.gs
          test ! -e backend/google-apps-script/index.html

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            node --check "$f"
          done < <(find api js -type f -name '*.js' -not -path 'js/legacy/*' -print0)
          echo 'JavaScript syntax checks passed.'

      - name: Run environment contract tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/environment-contract.test.js

      - name: Check HTML references to local assets
        shell: python
        run: |
          import pathlib, re, sys
          from urllib.parse import unquote
          root = pathlib.Path('.')
          errors = []
          for path in root.glob('*.html'):
              content = path.read_text(encoding='utf-8')
              refs = re.findall(r'''(?:href|src)=["'](/[^"'#?]+)''', content, re.I)
              for ref in refs:
                  if ref.startswith('/api/') or ref.startswith('//'):
                      continue
                  target = root / unquote(ref).lstrip('/')
                  if not target.exists():
                      errors.append(f'{path}: missing {ref}')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print('Local HTML references OK.')

      - name: Check Vercel config and database migration
        shell: python
        run: |
          import json, pathlib, sys
          root = pathlib.Path('.')
          try:
              json.loads((root / 'vercel.json').read_text(encoding='utf-8'))
          except Exception as exc:
              print(f'vercel.json is invalid JSON: {exc}')
              sys.exit(1)
          migration = (root / 'supabase/migrations/20261019000000_tama_andrea_core.sql').read_text(encoding='utf-8').lower()
          for marker in ('enable row level security', 'consume_public_rate_limit', 'create_public_order', 'revoke all'):
              if marker not in migration:
                  print(f'Missing database security/migration marker: {marker}')
                  sys.exit(1)
          inbox = (root / 'supabase/migrations/20261019000200_website_message_inbox.sql').read_text(encoding='utf-8').lower()
          for marker in ('website_messages', 'enable row level security', 'revoke all'):
              if marker not in inbox:
                  print(f'Missing website inbox security marker: {marker}')
                  sys.exit(1)
          browser_deny = (root / 'supabase/migrations/20261022200359_explicit_deny_browser_policies.sql').read_text(encoding='utf-8').lower()
          for marker in ('block_direct_browser_access', 'to anon, authenticated using (false) with check (false)', 'revoke all'):
              if marker not in browser_deny:
                  print(f'Missing explicit browser-deny policy marker: {marker}')
                  sys.exit(1)
          print('Vercel JSON and database migration checks passed.')

      - name: Check admin security and operational dashboard
        shell: python
        run: |
          import json, pathlib, re, sys
          root = pathlib.Path('.')
          config = json.loads((root / 'vercel.json').read_text(encoding='utf-8'))
          global_rule = next((x for x in config.get('headers', []) if x.get('source') == '/(.*)'), None)
          if not global_rule or not any(h.get('key', '').lower() == 'strict-transport-security' for h in global_rule.get('headers', [])):
              print('Missing global HSTS header.')
              sys.exit(1)
          for route in ('/admin', '/admin.html'):
              rule = next((x for x in config.get('headers', []) if x.get('source') == route), None)
              values = {h.get('key', '').lower(): h.get('value', '') for h in (rule or {}).get('headers', [])}
              policy = values.get('content-security-policy', '')
              script_policy = policy.split('script-src ', 1)[1].split(';', 1)[0] if 'script-src ' in policy else ''
              style_policy = policy.split('style-src ', 1)[1].split(';', 1)[0] if 'style-src ' in policy else ''
              if values.get('cache-control', '').find('no-store') < 0 or 'noindex' not in values.get('x-robots-tag', '') or not policy or "'unsafe-inline'" in script_policy or "'unsafe-inline'" in style_policy:
                  print(f'Admin security headers incomplete for {route}.')
                  sys.exit(1)
          html = (root / 'admin.html').read_text(encoding='utf-8')
          admin_css = (root / 'css/admin.css').read_text(encoding='utf-8')
          admin_js = (root / 'js/admin.js').read_text(encoding='utf-8')
          admin_api = (root / 'api/admin.js').read_text(encoding='utf-8')
          db_api = (root / 'api/_lib/db.js').read_text(encoding='utf-8')
          telegram_helper = (root / 'api/_lib/telegram.js').read_text(encoding='utf-8')
          public_api = (root / 'api/public.js').read_text(encoding='utf-8')
          messages_api = (root / 'api/messages.js').read_text(encoding='utf-8')
          service_worker = (root / 'sw.js').read_text(encoding='utf-8')
          if re.search(r'<script(?![^>]*\bsrc=)[^>]*>', html, re.I):
              print('Admin page must not contain inline script blocks.')
              sys.exit(1)
          if re.search(r'<style\b|\sstyle=', html, re.I):
              print('Admin page must use external CSS without inline styles.')
              sys.exit(1)
          for marker in ('data-tab="messages"', 'data-tab="notifications"', 'id="websiteMessagesBody"', 'id="notificationsBody"'):
              if marker not in html:
                  print(f'Missing admin dashboard UI marker: {marker}')
                  sys.exit(1)
          for marker in ("'website_messages'", "'notifications'", "updateWebsiteMessage", "websiteMessages:", "notifications:", "MFA_REQUIRED"):
              if marker not in admin_api:
                  print(f'Missing admin endpoint coverage marker: {marker}')
                  sys.exit(1)
          for marker in ('renderWebsiteMessages', 'renderNotifications', 'renderErrors', 'retryNotification', 'escapeHtml(m.message)'):
              if marker not in admin_js:
                  print(f'Missing admin controller safety/operations marker: {marker}')
                  sys.exit(1)
          for marker in ('systemStatus', 'error_logs', 'testTelegram', 'retryNotification'):
              if marker not in admin_api:
                  print(f'Missing server operations marker: {marker}')
                  sys.exit(1)
          for marker in ('scrubDiagnosticMessage', 'recordApiError', 'AbortSignal.timeout'):
              if marker not in db_api:
                  print(f'Missing server error logging/timeout marker: {marker}')
                  sys.exit(1)
          for marker in ('sendTelegramMessage', 'AbortSignal.timeout', 'payload.ok !== true'):
              if marker not in telegram_helper:
                  print(f'Missing centralized Telegram delivery safety marker: {marker}')
                  sys.exit(1)
          if "if (!created.duplicate) await sendOrderNotification(row)" not in public_api:
              print('Idempotent order retries must not send duplicate Telegram notifications.')
              sys.exit(1)
          if "require('./_lib/telegram')" not in messages_api:
              print('Website messages must use the shared Telegram helper.')
              sys.exit(1)
          if 'sendTelegramMessage(msg)' not in public_api or 'payload.ok !== true' not in telegram_helper:
              print('Order notifications must use the shared Telegram helper and verify Bot API ok status.')
              sys.exit(1)
          if "u.pathname==='/admin.html'" not in service_worker or "u.pathname.startsWith('/api/')" not in service_worker:
              print('Service worker must bypass admin documents and API routes.')
              sys.exit(1)
          print('Admin security and operational dashboard checks passed.')

      - name: Ensure active runtime uses Vercel API
        shell: bash
        run: |
          set -euo pipefail
          active=(admin.html js/site.js js/backend-bridge.js js/order-integration.js api)
          if grep -RInE --include='*.html' --include='*.js' 'script\.google\.com/macros|google\.script\.run|SpreadsheetApp|HtmlService\.createHtmlOutput' "${active[@]}"; then
            echo 'Legacy Google Apps Script runtime reference found.'
            exit 1
          fi
          echo 'Active runtime uses the Vercel API only.'

      - name: Check repository secrets and debug output
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='site-integrity.yml' --exclude='*.md' --exclude='.env.example' '(sb_secret_[A-Za-z0-9_-]{12,}|service_role_[A-Za-z0-9_-]{12,}|sk-[A-Za-z0-9_-]{20,}|[0-9]{8,12}:[A-Za-z0-9_-]{25,}|BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY)' .; then
            echo 'Potential credential material detected in repository.'
            exit 1
          fi
          if grep -RInE --include='*.html' --include='*.js' 'console\.log\([^)]*(password|token|secret|customer)' api js admin.html; then
            echo 'Potential sensitive debug output detected.'
            exit 1
          fi
          echo 'Secret-pattern and debug-output scans passed.'

      - name: Check retired division labels and private map pin
        shell: bash
        run: |
          set -euo pipefail
          files=(index.html index-live.html maintenance.html layanan.html servis.html tentang.html info.html karya.html bantuan.html pesan.html keluhan.html digital-works.html js/site.js manifest.json sitemap.xml)
          if grep -nEi 'TA Visual|TA Digital Works|maps\.app\.goo\.gl/K7HxLTnStVvTn9pW7|maps\.google\.com/maps\?q=Tama%20Andrea%20Studio' "${files[@]}"; then
            echo 'Retired division label or private-pin data remains in public-facing source.'
            exit 1
          fi
          echo 'Legacy label and private-pin checks passed.'
